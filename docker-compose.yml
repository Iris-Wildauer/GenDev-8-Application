services:
  app:
    build: .
    ports:
      - "3000:3000"
    networks:
      - app_network

  insurance:
    build: app/api/widgets/insurance/
    ports:
      - "8080:8080"
    networks:
      - app_network

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - app_network

networks:
  app_network:
    driver: bridge