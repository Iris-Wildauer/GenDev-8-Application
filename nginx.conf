server {
    listen 80;
    server_name 46.224.150.76 localhost;
    return 301 https://46.224.150.76$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 46.224.150.76 localhost 127.0.0.1;   # ← IP + localhost

    ssl_certificate /etc/letsencrypt/live/46.224.150.76/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/46.224.150.76/privkey.pem;

    location / {
        proxy_pass http://nextjs:3000;
        proxy_set_header Host $host;
    }
}